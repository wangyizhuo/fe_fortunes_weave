<title>迪托利希线商店表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: ledger of towns — sticky filter bar, then one ruled block per town, like a quartermaster's purchase book */
:root{
  --bg:#f6f5f1; --panel:#ffffff; --fg:#22232a; --muted:#6b6d78; --line:#dcdad2;
  --accent:#8a2d3b; --accent-soft:#f1e3e5; --gold:#9a7420; --chip:#ecebe5;
  --display:"Noto Serif SC","Songti SC",serif; --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181d; --panel:#1f2027; --fg:#e7e5df; --muted:#9a9ba6; --line:#33343d;
  --accent:#e2808f; --accent-soft:#3a2328; --gold:#d6b25e; --chip:#2a2b33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181d; --panel:#1f2027; --fg:#e7e5df; --muted:#9a9ba6; --line:#33343d;
  --accent:#e2808f; --accent-soft:#3a2328; --gold:#d6b25e; --chip:#2a2b33; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
h1{font-family:var(--display);font-size:28px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:65ch}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:16px}
.notes ul{margin:0;padding-left:18px;display:grid;gap:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
#q{flex:1 1 220px;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
#q:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:4px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.count{color:var(--muted);font-size:13px;margin:10px 0}
.town{margin-top:22px}
.town h2{font-family:var(--display);font-size:19px;margin:0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.town h2 small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;margin-top:6px;border-top:2px solid var(--fg)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat{display:inline-block;font-size:12px;padding:0 6px;border-radius:4px;background:var(--chip);color:var(--muted)}
.jp{color:var(--muted);font-size:12px}
.tag{color:var(--accent);font-size:12px}
.src{color:var(--muted);font-size:12px}
.one{color:var(--gold);font-weight:700}
mark{background:var(--accent-soft);color:inherit}
.empty{color:var(--muted);padding:24px 0}
a{color:var(--accent)}
footer{margin-top:32px;color:var(--muted);font-size:12px}
</style>
