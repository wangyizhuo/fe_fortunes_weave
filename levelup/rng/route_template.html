<title>万紫千红成长路线</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 布局：一列卷轴式清单。每个角色一节，节内每步一行：勾选 · 等级 · 动作 · 加点 · 分数，说明在行下展开 */
:root {
  --bg: #f3f4f7;
  --panel: #ffffff;
  --ink: #1c2233;
  --muted: #5d6680;
  --line: #dde1ea;
  --accent: #b0802a;      /* 纹章金 */
  --accent-ink: #7a5614;
  --exam: #c4632d;
  --exam-bg: #fbeee5;
  --gain-bg: #e2f1e6;
  --gain-ink: #1f6a3a;
  --done-ink: #9aa1b3;
  --next-bg: #fff6e2;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151d; --panel: #1b202b; --ink: #e6e9f2; --muted: #9aa3ba; --line: #2c3342;
  --accent: #d9a84e; --accent-ink: #f0c879; --exam: #ec8f5a; --exam-bg: #33231a;
  --gain-bg: #1c3526; --gain-ink: #8fdcaa; --done-ink: #5e6679; --next-bg: #2d2717; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12151d; --panel: #1b202b; --ink: #e6e9f2; --muted: #9aa3ba; --line: #2c3342;
  --accent: #d9a84e; --accent-ink: #f0c879; --exam: #ec8f5a; --exam-bg: #33231a;
  --gain-bg: #1c3526; --gain-ink: #8fdcaa; --done-ink: #5e6679; --next-bg: #2d2717; color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
header { display: grid; gap: 8px; }
h1 { font-family: var(--serif); font-weight: 800; font-size: clamp(26px, 5vw, 34px); margin: 0; letter-spacing: .02em; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; max-width: 65ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 13px; color: var(--muted); }
.bar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
#status { font-size: 13px; }
#status.warn { color: var(--exam); }
nav.jump { display: flex; flex-wrap: wrap; gap: 6px; }
nav.jump a { font-size: 13px; text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--panel);
  padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
nav.jump a:focus-visible, nav.jump a:hover { border-color: var(--accent); }

section.char { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.char-head { padding: 16px 18px 12px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.char-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.char-title h2 { font-family: var(--serif); font-weight: 800; font-size: 22px; margin: 0; }
.lv { font-family: var(--mono); color: var(--accent-ink); font-size: 14px; }
.prog { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.char-meta { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.char-meta b { color: var(--ink); font-weight: 500; }

ol.steps { list-style: none; margin: 0; padding: 0; }
li.step { border-bottom: 1px solid var(--line); }
li.step:last-child { border-bottom: 0; }
.row { display: grid; grid-template-columns: 28px 64px 1fr auto; gap: 4px 12px; align-items: start; padding: 10px 18px; }
.row input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
.lvl { font-family: var(--mono); font-size: 13px; padding-top: 2px; color: var(--muted); font-variant-numeric: tabular-nums; }
.main { min-width: 0; display: grid; gap: 4px; }
.act { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tag.exam { color: var(--exam); border-color: currentColor; background: var(--exam-bg); }
.cls { font-weight: 700; }
.gains { display: flex; flex-wrap: wrap; gap: 4px; }
.gains span { font-size: 12px; padding: 0 6px; border-radius: 3px; background: var(--gain-bg); color: var(--gain-ink); }
.note { font-size: 13px; color: var(--muted); }
.score { font-family: var(--mono); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; padding-top: 1px; }
.score small { display: block; font-family: var(--sans); font-size: 11px; color: var(--muted); }
details { font-size: 13px; color: var(--muted); }
summary { cursor: pointer; width: fit-content; }
details p { margin: 4px 0 0; }
li.step.exam .row { background: color-mix(in srgb, var(--exam-bg) 55%, transparent); }
li.step.next .row { background: var(--next-bg); box-shadow: inset 3px 0 0 var(--accent); }
li.step.next .lvl::after { content: "下一步"; display: block; font-family: var(--sans); font-size: 11px; color: var(--accent-ink); font-weight: 700; }
li.step.done .main, li.step.done .score, li.step.done .lvl { color: var(--done-ink); }
li.step.done .cls { text-decoration: line-through; }
li.step.done .gains span { background: transparent; color: var(--done-ink); border: 1px solid var(--line); }
body.hide-done li.step.done { display: none; }
.foot { padding: 10px 18px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.foot b { font-family: var(--mono); color: var(--ink); }
@media (max-width: 560px) {
  .row { grid-template-columns: 26px 1fr auto; }
  .lvl { grid-column: 2; }
  .main { grid-column: 2 / 4; }
  .score { grid-column: 3; grid-row: 1; }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }

.info { display: grid; gap: 10px; padding: 12px 18px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.info h3 { margin: 0 0 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.statgrid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.statgrid div { border: 1px solid var(--line); border-radius: 4px; text-align: center; padding: 2px 0; }
.statgrid small { display: block; font-size: 11px; color: var(--muted); }
.statgrid b { font-family: var(--mono); font-weight: 500; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 6px; cursor: pointer; }
.chips label:has(input:checked) { border-color: var(--accent); background: var(--next-bg); }
.chips input { accent-color: var(--accent); margin: 0; }
.skillgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.skillgrid label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
select, input[type=number] { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; min-width: 0; }
input.lvin { width: 64px; font-family: var(--mono); }
label.pickrow { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pick { flex: 1; min-width: 0; width: 100%; text-overflow: ellipsis; }
.changed { font-size: 11px; color: var(--exam); font-weight: 700; }
button.sync { font: inherit; font-size: 13px; font-weight: 700; color: var(--panel); background: var(--accent-ink); border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
button.sync:disabled { opacity: .5; cursor: default; }
#syncStatus { font-size: 13px; }
#syncStatus.warn { color: var(--exam); }
.noseed { padding: 12px 18px; font-size: 13px; color: var(--muted); }
@media (max-width: 560px) {
  .statgrid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .skillgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.ov { display: grid; gap: 12px; }
.ovcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.ovhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.ovhead h3 { margin: 0; font-family: var(--serif); font-size: 18px; }
.ovhead a { color: inherit; text-decoration: none; }
.ovsum { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ovsum b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.ovstats { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.ovstats div { border: 1px solid var(--line); border-radius: 4px; text-align: center; padding: 2px 0; font-variant-numeric: tabular-nums; }
.ovstats small { display: block; font-size: 11px; color: var(--muted); }
.ovstats b { font-family: var(--mono); font-weight: 500; font-size: 13px; }
.ovstats i { display: block; font-style: normal; font-size: 11px; color: var(--gain-ink); }
.ovroute { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; }
.ovroute span { padding: 0 6px; border-radius: 3px; border: 1px solid var(--line); }
.ovroute span.x { color: var(--exam); border-color: currentColor; }
body.only-ov main#list { display: none !important; }
.opts { display: grid; gap: 3px; margin-top: 2px; }
.opt { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: start; font-size: 12.5px; color: var(--muted);
  border: 1px solid transparent; border-radius: 5px; padding: 3px 6px; cursor: pointer; }
.opt input { margin: 2px 0 0; accent-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--next-bg); color: var(--ink); }
.opt .oc { font-weight: 700; color: var(--ink); }
.opt .on { font-family: var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.opt .need { color: var(--exam); font-weight: 400; }
.examline { font-size: 12px; color: var(--muted, #666); margin: 2px 0 4px; line-height: 1.6; }
.examline input { width: 64px; margin: 0 2px 0 6px; font: inherit; }
.examline .ok { color: #2e7d32; font-weight: 700; } .examline .bad { color: var(--exam); font-weight: 700; }
.src { font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--line); color: var(--muted); }
.cnt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.boost { color: var(--accent-ink); }
@media (max-width: 560px) { .ovstats { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
</style>
<div class="wrap">
  <header>
    <h1>万紫千红成长路线</h1>
    <div class="bar">
      <label for="onlyOv"><input type="checkbox" id="onlyOv"> 只看整体成长</label>
      <label for="showDone"><input type="checkbox" id="showDone"> 显示已完成</label>
      <span id="status">正在读取记录…</span>
    </div>
    <div class="bar">
      <button class="sync" id="syncBtn" type="button">同步到 Google Sheet</button>
      <span id="syncStatus"></span>
    </div>
  </header>
  <section class="ov" id="ov" aria-label="整体成长"></section>
  <main id="list" style="display:grid;gap:28px"></main>
</div>
<script>
const DATA = /*ROUTE_DATA*/{};
const SHEET_ID = "1sNlvXfRDNIhF0cVGieTvqqBEfn10JgG6mM0dOzOm0cg", SHEET_TAB = "成长进度", SERVER = "Google Sheets";
const RANKS = ["E", "E+", "D", "D+", "C", "C+", "B", "B+", "A", "A+", "S", "S+"];
const SLUG = { "迪托利希": "dietrich", "法毕欧": "fabio", "米迦艾拉": "michaela", "杨界": "yokai", "努蒂奴": "nutino", "乌尔坦德": "urtand",
  "艾丝梅拉尔达": "esmeralda", "伊欧": "io", "奇洛伊卡": "chiloica" };
const CH = DATA.chars, ST = DATA.stats;
const slug = c => SLUG[c.name] || "c" + CH.indexOf(c);
const keyOf = (c, s) => slug(c) + "-" + s.key;
let prog = {};      // key -> {done?: bool, choice?: string}
let info = {};      // slug -> {level, owned, skills}
let db = null;
const dirty = new Map();
let writing = false;

function esc(t) { return String(t ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
const charInfo = c => {
  const i = info[slug(c)] || {};
  return { level: i.level ?? c.level, owned: i.owned ?? [...c.owned], skills: { ...c.skills, ...(i.skills || {}) } };
};
const recOf = s => s.exam ? "exam" : s.cls;
const choiceOf = (c, s) => (prog[keyOf(c, s)] || {}).choice || recOf(s);
// 选中的结果：{exam:true} 或 {classes, gains, cnt, score}
function resultOf(s, choice) {
  if (choice === "exam") return { exam: true };
  const g = s.opts.find(o => o.classes.includes(choice));
  if (g) return g;
  if (choice === s.cls || choice === s.seenCls) return { classes: [choice], gains: s.gains, cnt: s.cnt, score: s.score };
  return { classes: [choice], gains: [], cnt: 0, score: 0 };
}
const gainChip = g => `<span>${esc(g.includes("+") ? g : g + "+1")}</span>`;
const statVec = gains => { const v = Array(9).fill(0); for (const g of gains) { const [k, n] = g.split("+"); const i = ST.indexOf(k); if (i >= 0) v[i] += n ? +n : 1; } return v; };

// 每个角色按顺序走一遍：等级、选中结果、是否完成
function walk(c) {
  const ci = charInfo(c), out = [];
  let lv = c.steps.length ? (c.steps[0].frm ?? c.planFrom) : ci.level;
  for (const s of c.steps) {
    const choice = choiceOf(c, s), r = resultOf(s, choice);
    const row = { s, choice, r, frm: lv, to: r.exam ? null : lv + 1 };
    if (!r.exam) lv++;
    out.push(row);
  }
  // 自动完成：升级到的等级 ≤ 当前等级；考试看它后面第一步升级是否完成
  let laterDone = false;
  for (let i = out.length - 1; i >= 0; i--) {
    const row = out[i];
    const auto = row.r.exam ? (laterDone || !!row.s.autoDone) : row.to <= ci.level;
    if (!row.r.exam) laterDone = auto;
    const p = prog[keyOf(c, row.s)] || {};
    row.auto = auto;
    row.done = p.done === undefined ? auto : p.done;
  }
  return { rows: out, endLevel: lv, ci };
}

function build() {
  document.getElementById("list").innerHTML = CH.map(charHtml).join("");
  document.getElementById("list").addEventListener("change", onChange);
}
function charHtml(c) {
  const all = [...new Set([...c.owned, ...c.classChoices])];
  return `<section class="char" id="${slug(c)}" data-slug="${slug(c)}">
    <div class="char-head">
      <div class="char-title"><h2>${esc(c.name)}</h2>
        <label class="lv">当前 Lv <input class="lvin" type="number" min="1" max="99" data-f="level" aria-label="${esc(c.name)} 当前等级"></label>
        <span class="lv">${esc(c.curClass || "")}</span>
        <span class="prog" data-prog="${slug(c)}"></span></div>
      ${c.steps.length ? `<div class="meter"><i data-meter="${slug(c)}"></i></div>` : ""}
      ${c.planFrom ? `<div class="char-meta"><span>${c.required.length ? `必考：${esc(c.required.join("、"))}；` : ""}规划 Lv${c.planFrom}→${c.planTo}，建议考 ${c.exams} 次</span></div>` : ""}
    </div>
    <div class="info">
      <div><h3>能力（11-05 截图${c.boosted.length ? "，金色▲是有加成的项" : ""}）</h3>
        <div class="statgrid">${ST.map((k, i) => `<div><small>${esc(k)}</small><b class="${c.boosted.includes(k) ? "boost" : ""}">${c.stats ? c.stats[i] : "?"}${c.boosted.includes(k) ? "▲" : ""}</b></div>`).join("")}</div></div>
      <div><h3>已有职业</h3><div class="chips">${all.map(k =>
        `<label><input type="checkbox" data-f="owned" value="${esc(k)}">${esc(k)}</label>`).join("")}</div></div>
      <div><h3>技能等级</h3><div class="skillgrid">${DATA.skills.map(k => `<label>${esc(k)}<select data-f="skill" data-k="${esc(k)}">
        <option value="">—</option>${RANKS.map(r => `<option>${r}</option>`).join("")}</select></label>`).join("")}</div></div>
    </div>
    ${c.steps.length ? `<ol class="steps">${c.steps.map(s => stepHtml(c, s)).join("")}</ol><div class="foot" data-foot="${slug(c)}"></div>`
      : `<div class="noseed">这个角色还没有观星记录和种子，暂时没有逐级路线。</div>`}
  </section>`;
}
function optHtml(c, s, value, label, gains, tail) {
  const name = "o-" + keyOf(c, s);
  return `<label class="opt"><input type="radio" name="${name}" value="${esc(value)}" data-f="choice">
    <span><span class="oc">${label}</span>${gains ? `　${esc(gains)}` : ""}</span><span class="on">${tail}</span></label>`;
}
function stepHtml(c, s) {
  const key = keyOf(c, s), id = "cb-" + key;
  const groups = s.opts.length ? s.opts : (s.seenCls ? [{ classes: [s.seenCls], owned: [true], gains: s.gains, cnt: s.cnt, score: s.score }] : []);
  const opts = groups.map(o => {
    const val = o.classes.includes(s.cls) ? s.cls : (o.classes.find((x, i) => o.owned[i]) || o.classes[0]);
    const have = s.src === "record" ? o.classes : o.classes.filter((x, i) => o.owned[i]);
    const need = s.src === "record" ? [] : o.classes.filter((x, i) => !o.owned[i]);
    const label = (have.length ? esc(have.join(" / ")) : "") + (need.length ? `<span class="need">${have.length ? "　" : ""}需考：${esc(need.join(" "))}</span>` : "");
    return optHtml(c, s, val, "升1级：" + label, o.gains.join(" ") || "—", `${o.cnt}项 · ${o.score}分`);
  }).join("") + optHtml(c, s, "exam", "考试" + (s.roll != null ? `<span class="need">　判定值 ${s.roll}%</span>` : ""), "不涨能力，跳过这一步", "");
  const srcTag = s.src === "record" ? `<span class="src">${s.hidden ? "没记录的一步" : s.inferred ? "没记录·按种子推算" : "观星记录"}</span>` : `<span class="src">规划</span>`;
  const seen = s.src === "record" && s.exam && !s.hidden ? `<div class="note">观星看到用${esc(s.seenCls)}会涨：${esc(s.gains.join(" ") || "—")}（${s.cnt}项 · ${s.score}分），不满意，考试跳过</div>` : "";
  return `<li class="step" data-key="${s.key}">
    <div class="row">
      <input type="checkbox" id="${id}" data-f="done" aria-label="已完成">
      <label class="lvl" for="${id}"></label>
      <div class="main">
        <div class="act">${srcTag}<span data-act></span></div>
        <div class="examline" data-examline hidden></div>
        <div class="gains" data-gains></div>
        ${seen}
        ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
        <div class="opts" role="radiogroup" aria-label="这一步的选择">${opts}</div>
      </div>
      <div class="score" data-score></div>
    </div></li>`;
}

function paint() {
  const showDone = document.getElementById("showDone").checked;
  for (const c of CH) {
    const sec = document.getElementById(slug(c)), w = walk(c), ci = w.ci;
    const lvIn = sec.querySelector('[data-f="level"]');
    if (document.activeElement !== lvIn) lvIn.value = ci.level ?? "";
    sec.querySelectorAll('[data-f="owned"]').forEach(el => el.checked = ci.owned.includes(el.value));
    sec.querySelectorAll('[data-f="skill"]').forEach(el => el.value = ci.skills[el.dataset.k] || "");
    if (!c.steps.length) continue;
    let n = 0, nextSet = false, cnt = 0, sc = 0;
    for (const row of w.rows) {
      const { s, choice, r } = row, li = sec.querySelector(`li[data-key="${s.key}"]`);
      li.querySelector('[data-f="done"]').checked = row.done;
      li.querySelectorAll('[data-f="choice"]').forEach(el => el.checked = el.value === choice || (!r.exam && el.value !== "exam" && r.classes && resultOf(s, el.value) === r));
      li.classList.toggle("done", row.done);
      li.classList.toggle("exam", !!r.exam);
      li.classList.toggle("next", !row.done && !nextSet);
      li.hidden = row.done && !showDone;
      if (!row.done && !nextSet) nextSet = true;
      if (row.done) n++; else if (!r.exam) { cnt += r.cnt; sc += r.score; }
      const changed = choice !== recOf(s);
      li.querySelector(".lvl").textContent = r.exam ? "考试" : `Lv${row.frm}→${row.to}`;
      li.querySelector("[data-act]").innerHTML = (r.exam
        ? `<span class="tag exam">考试·跳过</span>${s.exam && s.cls ? ` <span class="cls">${esc(s.cls)}</span>` : ""}`
        : `<span class="tag">升1级</span> <span class="cls">${esc(choice)}</span>` + (r.classes.length > 1 ? ` <span class="note">加点相同：${esc(r.classes.filter(x => x !== choice).join(" "))}</span>` : ""))
        + (changed ? ` <span class="changed">已改（原来：${esc(s.exam ? "考试" : s.cls)}）</span>` : "");
      li.querySelector("[data-gains]").innerHTML = r.exam ? "" : r.gains.map(gainChip).join("");
      const el = li.querySelector("[data-examline]");
      el.hidden = !r.exam || s.roll == null;
      if (!el.hidden) {
        const ch = (prog[keyOf(c, s)] || {}).chance, pass = ch != null ? s.roll < ch : null;
        const want = s.exam && s.cls ? s.cls : "";
        el.innerHTML = `考试判定值 <b>${s.roll}%</b>：游戏里显示的成功率要<b>高于</b>它才能过（过不过种子都前进一步）。`
          + `<label>游戏显示成功率 <input type="number" min="0" max="100" step="0.01" data-f="chance" value="${ch ?? ""}" aria-label="游戏显示的考试成功率">%</label>`
          + (pass == null ? "" : pass ? ` <span class="ok">✓ 能过${want ? "，拿到" + esc(want) : ""}</span>`
            : ` <span class="bad">✗ 会失败${want ? "，拿不到" + esc(want) + "（后面用它升级的步骤要改，告诉我重算）" : "（只当跳过，没影响）"}</span>`);
      }
      li.querySelector("[data-score]").innerHTML = r.exam ? "—" : `${r.score}<small>${r.cnt}项 · 加权分</small>`;
    }
    sec.querySelector(`[data-prog="${slug(c)}"]`).textContent = `完成 ${n} / ${c.steps.length}`;
    sec.querySelector(`[data-meter="${slug(c)}"]`).style.width = (100 * n / c.steps.length) + "%";
    sec.querySelector(`[data-foot="${slug(c)}"]`).innerHTML = `从 Lv${ci.level} 按现在的选择走到 Lv${w.endLevel}：还要涨 <b>${cnt}</b> 项，加权分 <b>${sc}</b>`;
  }
  paintOverview();
}
function paintOverview() {
  document.getElementById("ov").innerHTML = CH.map(c => {
    const w = walk(c), ci = w.ci, add = Array(9).fill(0), route = [];
    let cnt = 0, sc = 0;
    for (const row of w.rows) {
      if (row.done) continue;
      if (row.r.exam) { route.push(`<span class="x">考${esc(row.s.exam && row.s.cls ? row.s.cls : "")}</span>`); continue; }
      const v = statVec(row.r.gains); v.forEach((x, i) => add[i] += x);
      cnt += row.r.cnt; sc += row.r.score;
      route.push(`<span>${esc(row.choice)}</span>`);
    }
    const base = c.stats || Array(9).fill(null);
    return `<article class="ovcard"><div class="ovhead"><h3><a href="#${slug(c)}">${esc(c.name)}</a></h3>
      <span class="ovsum">Lv <b>${ci.level ?? "?"}</b> → <b>${w.endLevel}</b>　共 <b>${cnt}</b> 项　加权分 <b>${sc}</b></span></div>
      <div class="ovstats">${ST.map((k, i) => `<div><small>${esc(k)}</small><b>${base[i] ?? "?"}→${base[i] == null ? "?" : base[i] + add[i]}</b><i>${add[i] ? "+" + add[i] : "·"}</i></div>`).join("")}</div>
      ${route.length ? `<div class="ovroute">${route.join("")}</div>` : `<div class="ovsum">${c.steps.length ? "记录里的都完成了" : "还没有路线"}</div>`}
    </article>`;
  }).join("");
}
function setStatus(id, text, warn) { const el = document.getElementById(id); el.textContent = text; el.classList.toggle("warn", !!warn); }

function onChange(e) {
  const t = e.target, f = t.dataset.f; if (!f) return;
  const sec = t.closest("section.char"), c = CH.find(x => slug(x) === sec.dataset.slug);
  if (f === "done" || f === "choice" || f === "chance") {
    const s = c.steps.find(x => x.key === t.closest("li").dataset.key), key = keyOf(c, s);
    const p = { ...(prog[key] || {}) };
    if (f === "choice") p.choice = t.value === recOf(s) ? undefined : t.value;
    if (f === "chance") { const v = parseFloat(t.value); p.chance = v >= 0 && v <= 100 ? v : undefined; }
    prog[key] = p;   // 先按新选择算出自动值，再决定 done 要不要存
    if (f === "done") {
      const auto = walk(c).rows.find(r => r.s === s).auto;
      p.done = t.checked === auto ? undefined : t.checked;
    }
    const val = {}; if (p.done !== undefined) val.done = p.done; if (p.choice) val.choice = p.choice; if (p.chance != null) val.chance = p.chance;
    if (Object.keys(val).length) { prog[key] = val; queue("progress/" + key, { ...val, at: new Date().toISOString() }); }
    else { delete prog[key]; queue("progress/" + key, null); }
  } else {
    const ci = charInfo(c);
    if (f === "level") { const v = parseInt(t.value, 10); if (!(v > 0)) return; ci.level = v; }
    if (f === "owned") ci.owned = [...sec.querySelectorAll('[data-f="owned"]:checked')].map(x => x.value);
    if (f === "skill") { ci.skills = { ...ci.skills }; if (t.value) ci.skills[t.dataset.k] = t.value; else delete ci.skills[t.dataset.k]; }
    info[slug(c)] = { level: ci.level, owned: ci.owned, skills: ci.skills };
    queue("chars/" + slug(c), { ...info[slug(c)], at: new Date().toISOString() });
  }
  paint();
}
function queue(path, val) { dirty.set(path, val); if (!db) { saveLocal(); return; } flush(); }
async function flush() {
  if (writing) return; writing = true;
  try {
    while (dirty.size) {
      const [path, val] = dirty.entries().next().value;
      const [coll, id] = path.split("/"), ref = db.collection(coll).doc(id);
      if (val) await ref.set(val); else await ref.delete();
      if (dirty.get(path) === val) dirty.delete(path);
    }
    setStatus("status", "已保存");
  } catch (err) {
    setStatus("status", "没保存上：" + (err && err.code === "permission_denied" ? "你只有查看权限" : "网络或权限问题，刷新后再试"), true);
  } finally { writing = false; }
}
function saveLocal() { try { localStorage.setItem("route-state2", JSON.stringify({ prog, info })); } catch (_) {} }
function loadLocal() { try { const v = JSON.parse(localStorage.getItem("route-state2") || "{}"); prog = v.prog || {}; info = v.info || {}; } catch (_) {} }

// ---- 同步到 Google Sheet ----
function sheetValues() {
  const now = new Date().toLocaleString("zh-CN", { hour12: false });
  const v = [["整体成长（由成长路线页同步，别在这页手改，会被覆盖）", "", "", "同步时间", now]];
  v.push(["角色", "当前等级", "终点等级", "还要涨（项）", "加权分", ...ST.map(k => k + "（现在→终点）"), "已有职业", ...DATA.skills]);
  for (const c of CH) {
    const w = walk(c), ci = w.ci, add = Array(9).fill(0); let cnt = 0, sc = 0;
    for (const row of w.rows) if (!row.done && !row.r.exam) { statVec(row.r.gains).forEach((x, i) => add[i] += x); cnt += row.r.cnt; sc += row.r.score; }
    v.push([c.name, ci.level ?? "", w.endLevel, cnt, sc, ...ST.map((k, i) => c.stats ? `${c.stats[i]}→${c.stats[i] + add[i]}` : ""),
      ci.owned.join("、"), ...DATA.skills.map(k => ci.skills[k] || "")]);
  }
  v.push([""]);
  v.push(["角色", "来源", "等级", "原定", "我的选择", "已完成", "加点", "项数", "加权分", "这一步所有选择"]);
  for (const c of CH) for (const row of walk(c).rows) {
    const { s, r } = row;
    v.push([c.name, s.src === "record" ? (s.hidden ? "没记录" : "观星记录") : "规划", r.exam ? "考试" : `${row.frm}→${row.to}`,
      s.exam ? "考试" + (s.cls ? "·" + s.cls : "") : "升1级·" + s.cls, r.exam ? "考试" : "升1级·" + row.choice,
      row.done ? "✓" : "", r.exam ? "" : r.gains.join(" "), r.exam ? "" : r.cnt, r.exam ? "" : r.score,
      s.opts.map(o => `${o.classes.join("/")}:${o.cnt}项${o.score}分`).join("；")]);
  }
  const wd = Math.max(...v.map(r => r.length));
  return v.map(r => [...r, ...Array(wd - r.length).fill("")]);
}
const MCP_MSG = {
  server_not_connected: "没连上 Google Sheets：到 claude.ai 设置 → 连接器里添加 Google Sheets",
  needs_reauth: "Google Sheets 登录过期：到 claude.ai 设置 → 连接器里重新连接",
  approval_required: "需要你先允许这个页面使用 Google Sheets",
  consent_required: "需要你先允许这个页面使用 Google Sheets",
  cancelled: "已取消",
  blocked_by_policy: "组织策略不允许这个页面用 Google Sheets",
  tool_error: "表格那边报错",
};
async function syncSheet() {
  const btn = document.getElementById("syncBtn");
  const mcp = window.claude?.use ? await window.claude.use("mcp").catch(() => null) : null;
  if (!mcp) { setStatus("syncStatus", "这里用不了 Google Sheets（需要在 Claude 里打开这个页面）", true); return; }
  btn.disabled = true; setStatus("syncStatus", "正在写入「成长进度」…");
  try {
    const values = sheetValues();
    await mcp.callTool(SERVER, "batch_clear_values", { spreadsheetId: SHEET_ID, ranges: [SHEET_TAB + "!A1:Z400"] });
    await mcp.callTool(SERVER, "update_values", { spreadsheetId: SHEET_ID, range: SHEET_TAB + "!A1", values });
    setStatus("syncStatus", `已同步 ${values.length} 行到「成长进度」`);
  } catch (err) {
    const m = MCP_MSG[err?.code] || "同步失败";
    setStatus("syncStatus", m + (err?.code === "tool_error" && err.message ? "：" + err.message.slice(0, 160) : ""), true);
  } finally { btn.disabled = false; }
}
document.getElementById("syncBtn").addEventListener("click", syncSheet);

for (const [id, cls, def] of [["showDone", null, false], ["onlyOv", "only-ov", false]]) {
  const el = document.getElementById(id);
  try { const v = localStorage.getItem("route-" + id); el.checked = v === null ? def : v === "1"; } catch (_) { el.checked = def; }
  if (cls) document.body.classList.toggle(cls, el.checked);
  el.addEventListener("change", () => {
    if (cls) document.body.classList.toggle(cls, el.checked);
    try { localStorage.setItem("route-" + id, el.checked ? "1" : "0"); } catch (_) {}
    paint();
  });
}
build();
paint();
(async () => {
  db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) { loadLocal(); paint(); setStatus("status", "记录只存在这台设备的浏览器里（共享保存不可用）", true); return; }
  const timer = setTimeout(() => setStatus("status", "暂时连不上保存记录，显示的可能不是最新的", true), 10000);
  const watch = (coll, apply) => db.collection(coll).onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    const next = {};
    for (const d of snap.docs) next[d.id] = d.data();
    for (const [path, val] of dirty) { const [cl, id] = path.split("/"); if (cl === coll) { if (val) next[id] = val; else delete next[id]; } }
    apply(next); paint();
    if (!snap.metadata.fromCache) setStatus("status", "记录已同步");
  }, () => { clearTimeout(timer); setStatus("status", "读取记录失败，刷新页面再试", true); });
  watch("progress", v => { prog = {}; for (const [k, d] of Object.entries(v)) { const p = {}; if (typeof d?.done === "boolean") p.done = d.done; if (d?.choice) p.choice = d.choice; if (typeof d?.chance === "number") p.chance = d.chance; if (Object.keys(p).length) prog[k] = p; } });
  watch("chars", v => { info = {}; for (const [k, d] of Object.entries(v)) if (d) info[k] = { level: d.level, owned: d.owned, skills: d.skills || {} }; });
})();
